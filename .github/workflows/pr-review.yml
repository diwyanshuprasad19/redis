name: pr-review
on:
  pull_request:

jobs:
  reviewdog-ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest
      - name: ruff → reviewdog (PR diff comments)
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # reviewdog github-pr-review posts only on lines in the PR diff
          ruff check --output-format=pylint src tests scripts 2>/dev/null | \
            reviewdog -f=pylint -name=ruff -reporter=github-pr-review -filter-mode=added -level=warning || true

  pr-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: PR Agent review (git diff / PR files)
        uses: qodo-ai/pr-agent@main
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          github_action: "true"
        continue-on-error: true
