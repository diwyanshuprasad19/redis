[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redis-app"
version = "0.1.0"
description = "Large-scale Redis client: bounded pool + pipeline batching"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "redis>=5.0,<6",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "fakeredis>=2.21",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
